      <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>

  </svg>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <svg class="brand-mark"><use href="#i-logo"/></svg>
        <div>
          <div class="brand-name">J.A.R.V.I.S</div>
          <div class="brand-sub">Personal AI Command Center</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="engine-status"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><svg><use href="#i-menu"/></svg></button>
        <h1 class="view-title" id="view-title">Home</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="approvals-btn" aria-label="Pending approvals"><svg><use href="#i-shield"/></svg><span class="badge" id="approvals-badge" hidden></span></button>
          <button class="icon-btn" id="notif-btn" aria-label="Notifications"><svg><use href="#i-bell"/></svg><span class="badge" id="notif-badge" hidden></span></button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-label="Notifications" hidden></aside>
  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
